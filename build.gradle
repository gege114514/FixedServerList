buildscript {
    repositories {
        // 只保留国内可访问的镜像，完全移除官方源
        maven { url = 'https://bmclapi2.bangbang93.com/maven' }
        maven { url = 'https://maven.aliyun.com/repository/public' }
        maven { url = 'https://maven.aliyun.com/repository/gradle-plugin' }
    }
    dependencies {
        // 使用精确版本号，禁止使用范围动态版本
        classpath 'net.minecraftforge.gradle:ForgeGradle:6.0.16'
        classpath 'org.spongepowered:mixingradle:0.7.38'
    }
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'org.spongepowered.mixin'

version = '1.0'
group = 'com.example.fixedserverlist'
archivesBaseName = 'FixedServerList-1.20.1'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
            property 'forge.logging.console.level', 'debug'
            arg '-mixin.config=fixedserverlist.mixins.json'
            mods {
                fixedserverlist {
                    source sourceSets.main
                }
            }
        }
    }
}

mixin {
    add sourceSets.main, 'fixedserverlist.refmap.json'
    config 'fixedserverlist.mixins.json'
}

repositories {
    maven { url = 'https://bmclapi2.bangbang93.com/maven' }
    maven { url = 'https://maven.aliyun.com/repository/public' }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.2.0'
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

jar {
    manifest {
        attributes([
            'MixinConfigs': 'fixedserverlist.mixins.json'
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}